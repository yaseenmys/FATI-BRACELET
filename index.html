<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYS ENTERPRISES - Background Remover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ================= RESET & BASE ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background-color: #ffffff;
    color: #333;
    min-height: 100vh;
    overflow-x: hidden;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: 'Inter', sans-serif; }

  /* ================= NAVBAR ================= */
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 48px;
    background: #fff;
    border-bottom: 1px solid #f0f0f0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 800;
    color: #2d2d2d;
    letter-spacing: -0.5px;
  }
  .logo svg { width: 28px; height: 28px; }
  .logo span { color: #1e6fff; } /* Highlight MYS */
  
  .nav-links {
    display: flex;
    gap: 32px;
  }
  .nav-links a {
    font-size: 15px;
    font-weight: 500;
    color: #555;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: #000; }
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .login { font-size: 15px; font-weight: 500; color: #333; }
  .signup-btn {
    background: #f0f0f0;
    padding: 9px 20px;
    border-radius: 24px;
    font-weight: 600;
    font-size: 14px;
    color: #333;
    transition: 0.2s;
  }
  .signup-btn:hover { background: #e4e4e4; }

  /* ================= HERO SECTION ================= */
  .hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1240px;
    margin: 60px auto 0;
    padding: 0 48px;
    gap: 60px;
    min-height: calc(100vh - 160px);
  }
  .hero-text { flex: 1; max-width: 550px; }
  .hero-text h1 {
    font-size: 64px;
    line-height: 1.05;
    font-weight: 800;
    color: #2d2d2d;
    letter-spacing: -2px;
    margin-bottom: 24px;
  }
  .hero-text p {
    font-size: 20px;
    color: #555;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    background: #1e6fff;
    color: #fff;
    padding: 3px 12px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
  }

  /* ================= UPLOAD CARD ================= */
  .upload-card {
    background: #ffffff;
    width: 460px;
    padding: 48px 32px;
    border-radius: 28px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.08), 0 6px 20px rgba(0,0,0,0.04);
    border: 1px solid #f0f0f0;
    text-align: center;
    flex-shrink: 0;
  }
  .btn-blue {
    background: #1e6fff;
    color: #fff;
    border: none;
    padding: 18px 40px;
    border-radius: 32px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    width: 100%;
    max-width: 260px;
  }
  .btn-blue:hover {
    background: #1557cc;
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(30, 111, 255, 0.35);
  }
  .drop-text {
    margin-top: 26px;
    color: #666;
    font-size: 16px;
    line-height: 1.5;
  }
  .drop-text small { color: #999; font-size: 13px; display: block; margin-top: 2px; }

  /* Sample thumbnails */
  .samples { margin-top: 44px; text-align: left; }
  .samples p { font-size: 13px; color: #777; margin-bottom: 12px; font-weight: 500; }
  .sample-imgs { display: flex; gap: 10px; }
  .s-box {
    width: 58px; height: 58px;
    border-radius: 12px;
    background-color: #eee;
    cursor: pointer;
    transition: 0.2s;
    background-size: cover;
    background-position: center;
    border: 1px solid #eee;
  }
  .s-box:hover { transform: scale(1.06); border-color: #1e6fff; }

  /* ================= EDITOR SECTION ================= */
  .editor-section {
    display: none;
    max-width: 1150px;
    margin: 30px auto;
    padding: 20px;
  }
  .editor-container {
    display: grid;
    grid-template-columns: 1fr 320px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    overflow: hidden;
    border: 1px solid #f0f0f0;
  }
  .canvas-area {
    background: repeating-conic-gradient(#f0f0f0 0% 25%, #fff 0% 50%) 50% / 24px 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 480px;
    padding: 30px;
    position: relative;
  }
  canvas { max-width: 100%; max-height: 600px; display: block; }
  
  .sidebar {
    padding: 30px 26px;
    border-left: 1px solid #f0f0f0;
    background: #fdfdfd;
  }
  .sidebar h3 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 24px;
    color: #2d2d2d;
  }
  .control-group { margin-bottom: 26px; }
  .control-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 10px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: #1e6fff;
    height: 6px;
    cursor: pointer;
  }
  .color-pick { display: flex; gap: 10px; align-items: center; }
  input[type="color"] {
    width: 48px; height: 42px;
    border: 1px solid #ddd;
    border-radius: 10px;
    cursor: pointer;
    padding: 3px;
    background: #fff;
  }
  .btn-outline {
    background: #fff;
    border: 1.5px solid #e0e0e0;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    color: #555;
    transition: 0.2s;
    flex: 1;
  }
  .btn-outline:hover { border-color: #bbb; background: #f9f9f9; }
  
  .action-btns { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
  .action-btns .btn-blue { max-width: 100%; padding: 14px; font-size: 15px; }

  /* Drag over effect */
  .upload-card.dragover {
    border-color: #1e6fff;
    background: #f5f9ff;
    transform: scale(1.02);
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 960px) {
    .nav-links { display: none; }
    .hero {
      flex-direction: column;
      text-align: center;
      margin: 40px auto;
      padding: 0 24px;
    }
    .hero-text h1 { font-size: 44px; letter-spacing: -1px; }
    .hero-text p { justify-content: center; font-size: 17px; }
    .upload-card { width: 100%; max-width: 460px; }
    .editor-container { grid-template-columns: 1fr; }
    .sidebar { border-left: none; border-top: 1px solid #f0f0f0; }
    .navbar { padding: 16px 24px; }
  }
</style>
</head>
<body>

  <!-- ========= NAVBAR ========= -->
  <nav class="navbar" id="navbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#1e6fff"/>
        <path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="#1e6fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>MYS ENTERPRISES</span>
    </div>
    <div class="nav-links">
      <a href="#">Uploads</a>
      <a href="#">Bulk Editing</a>
      <a href="#">API</a>
      <a href="#">Plugins</a>
      <a href="#">Pricing</a>
    </div>
    <div class="nav-actions">
      <a href="#" class="login">Log in</a>
      <a href="#" class="signup-btn">Sign up</a>
    </div>
  </nav>

  <!-- ========= HERO / UPLOAD ========= -->
  <main class="hero" id="heroSection">
    <div class="hero-text">
      <h1>Remove Image<br>Background</h1>
      <p>100% Automatically and <span class="badge">Free</span></p>
    </div>

    <div class="upload-card" id="uploadBox">
      <input type="file" id="fileInput" accept="image/*" hidden>
      
      <button class="btn-blue" onclick="document.getElementById('fileInput').click()">
        Upload Image
      </button>
      
      <p class="drop-text">
        or drop a file,
        <small>paste image or URL</small>
      </p>

      <div class="samples">
        <p>No image? Try one of these:</p>
        <div class="sample-imgs">
          <div class="s-box" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop');"></div>
          <div class="s-box" style="background-image: url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100&auto=format&fit=crop');"></div>
          <div class="s-box" style="background-image: url('https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=100&auto=format&fit=crop');"></div>
          <div class="s-box" style="background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop');"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- ========= EDITOR ========= -->
  <section class="editor-section" id="editorSection">
    <div class="editor-container">
      
      <div class="canvas-area">
        <canvas id="canvas"></canvas>
      </div>

      <div class="sidebar">
        <h3>Edit Image</h3>
        
        <div class="control-group">
          <label>Background Color</label>
          <div class="color-pick">
            <input type="color" id="bgColor" value="#ffffff">
            <button class="btn-outline" id="pickBtn">Pick from Image</button>
          </div>
        </div>

        <div class="control-group">
          <label>Tolerance: <span id="tolVal">30</span></label>
          <input type="range" id="tolerance" min="1" max="150" value="30">
        </div>

        <div class="action-btns">
          <button class="btn-blue" id="downloadBtn">⬇️ Download PNG</button>
          <button class="btn-outline" id="resetBtn">Upload New Image</button>
        </div>
      </div>

    </div>
  </section>

<script>
  /* ================= ELEMENTS ================= */
  const navbar = document.getElementById('navbar');
  const heroSection = document.getElementById('heroSection');
  const editorSection = document.getElementById('editorSection');
  const uploadBox = document.getElementById('uploadBox');
  const fileInput = document.getElementById('fileInput');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const tolerance = document.getElementById('tolerance');
  const tolVal = document.getElementById('tolVal');
  const bgColor = document.getElementById('bgColor');
  const pickBtn = document.getElementById('pickBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');

  let originalImage = null;
  let originalData = null;
  let picking = false;
  let debounceTimer = null;

  /* ================= FAST FILE UPLOAD ================= */
  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

  // Drag & Drop
  ['dragover', 'dragenter'].forEach(evt => {
    uploadBox.addEventListener(evt, e => { e.preventDefault(); uploadBox.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(evt => {
    uploadBox.addEventListener(evt, e => { e.preventDefault(); uploadBox.classList.remove('dragover'); });
  });
  uploadBox.addEventListener('drop', e => {
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('Sirf image files allowed hain!');
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      originalImage = new Image();
      originalImage.onload = () => {
        setupCanvas();
        heroSection.style.display = 'none';
        navbar.style.display = 'none';
        editorSection.style.display = 'block';
      };
      originalImage.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function setupCanvas() {
    // Speed optimization: Max width 800px for fast processing
    const maxW = 800; 
    let w = originalImage.width;
    let h = originalImage.height;
    if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
    
    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(originalImage, 0, 0, w, h);
    
    // Original data ko cache karo
    originalData = ctx.getImageData(0, 0, w, h);
    removeBackground();
  }

  /* ================= BACKGROUND REMOVAL (FAST) ================= */
  // Slider mein debounce lagaya hai taake lag na kare
  tolerance.addEventListener('input', () => {
    tolVal.textContent = tolerance.value;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      if (originalData) removeBackground();
    }, 50); // 50ms delay for smoothness
  });

  bgColor.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      if (originalData) removeBackground();
    }, 50);
  });

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function removeBackground() {
    if (!originalData) return;
    
    // Fast copy using Uint8ClampedArray
    const imgData = new ImageData(
      new Uint8ClampedArray(originalData.data),
      originalData.width,
      originalData.height
    );
    const data = imgData.data;
    const target = hexToRgb(bgColor.value);
    const tol = parseInt(tolerance.value);
    const tolSq = tol * tol * 3;

    // Fast loop
    for (let i = 0; i < data.length; i += 4) {
      const dr = data[i] - target.r;
      const dg = data[i + 1] - target.g;
      const db = data[i + 2] - target.b;
      
      if ((dr * dr + dg * dg + db * db) <= tolSq) {
        data[i + 3] = 0; // Transparent
      }
    }
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.putImageData(imgData, 0, 0);
  }

  /* ================= COLOR PICKER ================= */
  pickBtn.addEventListener('click', () => {
    picking = true;
    pickBtn.textContent = 'Click on image...';
    pickBtn.style.color = '#1e6fff';
    pickBtn.style.borderColor = '#1e6fff';
    canvas.style.cursor = 'crosshair';
  });

  canvas.addEventListener('click', e => {
    if (!picking) return;
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
    const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
    
    const od = originalData.data;
    const idx = (y * canvas.width + x) * 4;
    const hex = '#' +
      od[idx].toString(16).padStart(2, '0') +
      od[idx + 1].toString(16).padStart(2, '0') +
      od[idx + 2].toString(16).padStart(2, '0');
      
    bgColor.value = hex;
    picking = false;
    canvas.style.cursor = 'default';
    pickBtn.textContent = 'Pick from Image';
    pickBtn.style.color = '';
    pickBtn.style.borderColor = '';
    removeBackground();
  });

  /* ================= DOWNLOAD ================= */
  downloadBtn.addEventListener('click', () => {
    if (!originalData) return;
    const link = document.createElement('a');
    link.download = 'MYS-removed-bg.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  /* ================= RESET ================= */
  resetBtn.addEventListener('click', () => {
    fileInput.value = '';
    originalImage = null;
    originalData = null;
    heroSection.style.display = 'flex';
    navbar.style.display = 'flex';
    editorSection.style.display = 'none';
    tolerance.value = 30;
    tolVal.textContent = '30';
    bgColor.value = '#ffffff';
  });
</script>
</body>
</html>
